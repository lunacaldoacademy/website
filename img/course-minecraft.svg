<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD8E8"/><stop offset="1" stop-color="#DDEEF3"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#sky)"/>
  <!-- 雲 -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="20" y="20" width="40" height="10"/>
    <rect x="30" y="30" width="50" height="10"/>
    <rect x="130" y="15" width="40" height="10"/>
  </g>
  <!-- 太陽 -->
  <rect x="160" y="35" width="20" height="20" fill="#FFC93C"/>
  <!-- 地面 -->
  <g>
    <rect x="0" y="100" width="200" height="14" fill="#7BAE5C"/>
    <rect x="0" y="114" width="200" height="46" fill="#8B5A3C"/>
    <!-- 地面のブロック区切り -->
    <g stroke="#5d3a26" stroke-width="0.6" fill="none">
      <line x1="20" y1="100" x2="20" y2="160"/>
      <line x1="40" y1="100" x2="40" y2="160"/>
      <line x1="60" y1="100" x2="60" y2="160"/>
      <line x1="80" y1="100" x2="80" y2="160"/>
      <line x1="100" y1="100" x2="100" y2="160"/>
      <line x1="120" y1="100" x2="120" y2="160"/>
      <line x1="140" y1="100" x2="140" y2="160"/>
      <line x1="160" y1="100" x2="160" y2="160"/>
      <line x1="180" y1="100" x2="180" y2="160"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="140" x2="200" y2="140"/>
    </g>
    <g stroke="#4d7a36" stroke-width="0.6" fill="none">
      <line x1="20" y1="100" x2="20" y2="114"/>
      <line x1="40" y1="100" x2="40" y2="114"/>
      <line x1="60" y1="100" x2="60" y2="114"/>
      <line x1="80" y1="100" x2="80" y2="114"/>
      <line x1="100" y1="100" x2="100" y2="114"/>
      <line x1="120" y1="100" x2="120" y2="114"/>
      <line x1="140" y1="100" x2="140" y2="114"/>
      <line x1="160" y1="100" x2="160" y2="114"/>
      <line x1="180" y1="100" x2="180" y2="114"/>
    </g>
  </g>
  <!-- 建造物（家） -->
  <g transform="translate(90 50)">
    <rect width="60" height="50" fill="#C2A074" stroke="#8B5A3C" stroke-width="1"/>
    <polygon points="0,0 30,-22 60,0" fill="#a8514b" stroke="#7a3530" stroke-width="1"/>
    <rect x="22" y="22" width="16" height="28" fill="#5d3a26"/>
    <rect x="6" y="10" width="10" height="10" fill="#9FD8E8" stroke="#5d3a26" stroke-width="0.6"/>
    <rect x="44" y="10" width="10" height="10" fill="#9FD8E8" stroke="#5d3a26" stroke-width="0.6"/>
  </g>
  <!-- キャラ -->
  <g transform="translate(40 85)">
    <rect x="-8" y="-30" width="16" height="16" fill="#FFE0C2" stroke="#8B5A3C" stroke-width="1"/>
    <rect x="-4" y="-26" width="2" height="3" fill="#1A1A1A"/>
    <rect x="2" y="-26" width="2" height="3" fill="#1A1A1A"/>
    <rect x="-7" y="-14" width="14" height="20" fill="#5DC2D0" stroke="#3d8a96" stroke-width="1"/>
  </g>
</svg>
