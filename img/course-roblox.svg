<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1B4E"/><stop offset="1" stop-color="#FF7A9C"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#rb)"/>
  <!-- 星 -->
  <g fill="#FFFFFF">
    <circle cx="30" cy="25" r="1.5"/>
    <circle cx="60" cy="15" r="1"/>
    <circle cx="170" cy="40" r="1.5"/>
    <circle cx="180" cy="20" r="1"/>
    <circle cx="100" cy="30" r="1"/>
  </g>
  <!-- 床（チェッカー） -->
  <g>
    <polygon points="0,160 200,160 200,90 0,110" fill="#3D2456"/>
    <g fill="#5A3877">
      <polygon points="0,160 50,160 50,108 0,113"/>
      <polygon points="100,160 150,160 150,99 100,103"/>
      <polygon points="50,108 100,103 100,160 50,160"/>
      <polygon points="150,99 200,90 200,160 150,160"/>
    </g>
  </g>
  <!-- 3Dブロック -->
  <g transform="translate(45 95)">
    <polygon points="0,0 30,-10 60,0 60,30 30,40 0,30" fill="#FFC93C"/>
    <polygon points="0,0 30,10 30,40 0,30" fill="#c79520"/>
    <polygon points="30,10 60,0 60,30 30,40" fill="#FF9F43"/>
  </g>
  <g transform="translate(110 75)">
    <polygon points="0,0 30,-10 60,0 60,30 30,40 0,30" fill="#5DC2D0"/>
    <polygon points="0,0 30,10 30,40 0,30" fill="#3d8a96"/>
    <polygon points="30,10 60,0 60,30 30,40" fill="#7BD5E0"/>
  </g>
  <!-- ロボキャラ -->
  <g transform="translate(150 50)">
    <rect x="-12" y="-6" width="24" height="22" rx="3" fill="#FFC93C"/>
    <circle cx="-5" cy="2" r="3" fill="#FFFFFF"/>
    <circle cx="5" cy="2" r="3" fill="#FFFFFF"/>
    <circle cx="-5" cy="2" r="1.5" fill="#1A1A1A"/>
    <circle cx="5" cy="2" r="1.5" fill="#1A1A1A"/>
    <rect x="-2" y="-12" width="4" height="6" fill="#FFC93C"/>
    <circle cx="0" cy="-14" r="2" fill="#FF7A9C"/>
  </g>
  <!-- ロゴ風 -->
  <g transform="translate(20 130)">
    <rect width="30" height="22" rx="5" fill="#FFFFFF" transform="rotate(-8)"/>
    <text x="15" y="16" text-anchor="middle" font-family="Arial Black" font-size="16" font-weight="900" fill="#1A1A1A" transform="rotate(-8)">R</text>
  </g>
</svg>
