<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8ECF1"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>
  <rect width="200" height="160" fill="url(#pg)"/>
  <!-- デスクトップウィンドウ -->
  <g transform="translate(20 22)">
    <rect width="160" height="115" rx="4" fill="#FFFFFF" stroke="#5DC2D0" stroke-width="1.5"/>
    <rect width="160" height="14" rx="4" fill="#5DC2D0"/>
    <circle cx="8" cy="7" r="2" fill="#FF7A9C"/>
    <circle cx="16" cy="7" r="2" fill="#FFC93C"/>
    <circle cx="24" cy="7" r="2" fill="#7BAE5C"/>
    <!-- Word アイコン -->
    <g transform="translate(14 28)">
      <rect width="28" height="34" rx="2" fill="#2B579A"/>
      <text x="14" y="22" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#FFFFFF">W</text>
    </g>
    <!-- Excel -->
    <g transform="translate(52 28)">
      <rect width="28" height="34" rx="2" fill="#217346"/>
      <text x="14" y="22" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#FFFFFF">X</text>
    </g>
    <!-- PowerPoint -->
    <g transform="translate(90 28)">
      <rect width="28" height="34" rx="2" fill="#D24726"/>
      <text x="14" y="22" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#FFFFFF">P</text>
    </g>
    <!-- AI -->
    <g transform="translate(128 28)">
      <rect width="28" height="34" rx="2" fill="#1A1A1A"/>
      <text x="14" y="22" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="11" font-weight="900" fill="#FFC93C">AI</text>
      <circle cx="22" cy="6" r="2" fill="#FF7A9C"/>
    </g>
    <!-- HTML -->
    <g transform="translate(14 70)">
      <rect width="28" height="34" rx="2" fill="#E44D26"/>
      <text x="14" y="22" text-anchor="middle" font-family="Arial Black" font-size="10" font-weight="900" fill="#FFFFFF">&lt;/&gt;</text>
    </g>
    <!-- ブラシ -->
    <g transform="translate(52 70)">
      <rect width="28" height="34" rx="2" fill="#9B59B6"/>
      <text x="14" y="22" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">Web</text>
    </g>
    <!-- プレゼン -->
    <g transform="translate(90 70)">
      <rect width="28" height="34" rx="2" fill="#FFC93C"/>
      <text x="14" y="22" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="14" font-weight="900" fill="#1A1A1A">▣</text>
    </g>
    <!-- タイピング -->
    <g transform="translate(128 70)">
      <rect width="28" height="34" rx="2" fill="#5DC2D0"/>
      <g transform="translate(4 12)" fill="#FFFFFF">
        <rect width="4" height="4" rx="0.5"/>
        <rect x="6" width="4" height="4" rx="0.5"/>
        <rect x="12" width="4" height="4" rx="0.5"/>
        <rect x="18" width="4" height="4" rx="0.5"/>
        <rect y="6" width="4" height="4" rx="0.5"/>
        <rect x="6" y="6" width="4" height="4" rx="0.5"/>
        <rect x="12" y="6" width="4" height="4" rx="0.5"/>
        <rect x="18" y="6" width="4" height="4" rx="0.5"/>
      </g>
    </g>
  </g>
  <!-- 装飾スパーク -->
  <g fill="#FFC93C">
    <polygon points="10,140 13,148 21,150 13,152 10,160 7,152 -1,150 7,148"/>
  </g>
</svg>
