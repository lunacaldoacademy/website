<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="教室位置マップ">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D9E8EB" stroke-width="0.6"/>
    </pattern>
  </defs>
  <!-- 背景 -->
  <rect width="600" height="200" fill="#F2F8F9"/>
  <rect width="600" height="200" fill="url(#grid)"/>

  <!-- 道路 -->
  <path d="M0,130 Q150,120 300,135 T600,140" stroke="#FFFFFF" stroke-width="22" fill="none"/>
  <path d="M0,130 Q150,120 300,135 T600,140" stroke="#C7D6D9" stroke-width="22" fill="none" stroke-dasharray="0" opacity="0"/>
  <path d="M280,0 L295,200" stroke="#FFFFFF" stroke-width="14"/>

  <!-- センターライン -->
  <path d="M0,130 Q150,120 300,135 T600,140" stroke="#FFC93C" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M287,0 L290,200" stroke="#FFC93C" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- 緑地 -->
  <circle cx="100" cy="60" r="28" fill="#DDE9D6"/>
  <circle cx="115" cy="50" r="14" fill="#7BAE5C" opacity="0.5"/>
  <circle cx="500" cy="55" r="22" fill="#DDE9D6"/>

  <!-- 周辺の建物 -->
  <rect x="60"  y="155" width="40" height="30" fill="#E5DAC9" stroke="#C7B79A" stroke-width="0.8"/>
  <rect x="120" y="160" width="50" height="25" fill="#E5DAC9" stroke="#C7B79A" stroke-width="0.8"/>
  <rect x="380" y="158" width="45" height="28" fill="#E5DAC9" stroke="#C7B79A" stroke-width="0.8"/>
  <rect x="450" y="155" width="60" height="32" fill="#E5DAC9" stroke="#C7B79A" stroke-width="0.8"/>
  <rect x="200" y="20"  width="50" height="38" fill="#E5DAC9" stroke="#C7B79A" stroke-width="0.8"/>
  <rect x="380" y="22"  width="45" height="35" fill="#E5DAC9" stroke="#C7B79A" stroke-width="0.8"/>

  <!-- カフェルナカルド（教室の建物） -->
  <g transform="translate(290 90)">
    <!-- 建物本体 2階建て風 -->
    <rect x="-40" y="-2" width="80" height="50" fill="#FFFFFF" stroke="#8B5A3C" stroke-width="1.5"/>
    <rect x="-40" y="-2" width="80" height="22" fill="#FFE9A8"/>
    <text x="0" y="13" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="9" font-weight="800" fill="#8B5A3C">2F 教室</text>
    <text x="0" y="35" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="8" font-weight="700" fill="#8B5A3C">1F カフェ</text>
    <!-- 屋根 -->
    <path d="M-44,-2 L0,-18 L44,-2 Z" fill="#8B5A3C"/>
  </g>

  <!-- ピン -->
  <g transform="translate(290 70)">
    <path d="M0,-32 C-14,-32 -22,-22 -22,-12 C-22,2 0,22 0,22 C0,22 22,2 22,-12 C22,-22 14,-32 0,-32 Z" fill="#FF7A9C" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="-14" r="7" fill="#FFFFFF"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="10" font-weight="900" fill="#FF7A9C">★</text>
  </g>

  <!-- ラベル -->
  <g transform="translate(290 158)">
    <rect x="-58" y="-10" width="116" height="20" rx="10" fill="#1A1A1A"/>
    <text x="0" y="4" text-anchor="middle" font-family="Yu Gothic, sans-serif" font-size="10" font-weight="800" fill="#FFC93C">ルナカルドアカデミー</text>
  </g>

  <!-- 方角 -->
  <g transform="translate(560 30)">
    <circle r="14" fill="#FFFFFF" stroke="#8B5A3C" stroke-width="1"/>
    <polygon points="0,-10 -4,0 0,-2 4,0" fill="#FF7A9C"/>
    <polygon points="0,10  -4,0 0,2  4,0" fill="#1A1A1A"/>
    <text x="0" y="-15" text-anchor="middle" font-size="7" font-weight="800" fill="#1A1A1A">N</text>
  </g>
</svg>
